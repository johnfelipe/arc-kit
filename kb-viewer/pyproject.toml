[project]
name = "arckit-kb-viewer"
version = "1.0.0"
description = "ArcKit Knowledge Base Viewer for CAP Core Banking Architecture Artifacts"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pyyaml==6.0.2",
    "markdown==3.7",
    "python-jose[cryptography]==3.3.0",
    "jinja2==3.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
